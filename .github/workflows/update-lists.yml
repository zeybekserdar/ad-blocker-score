name: Update blocklist data

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build data/lists.json
        run: node scripts/build-lists.mjs

      - name: Self-test
        run: node scripts/selftest.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/lists.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lists.json
          git commit -m "Update blocklist data"
          git push
